# Nexora: one app container (Rails serving the API and the React client) plus Postgres.
#   docker compose up --build        -> http://127.0.0.1:5001
# Settings come from .env.docker (copy .env.example).
services:
  db:
    image: postgres:15-alpine
    restart: always
    env_file: .env.docker
    environment:
      POSTGRES_USER: nexora
      POSTGRES_DB: nexora_production
      # POSTGRES_PASSWORD comes from .env.docker
    # Not published to the host: only the app can reach it.
    # For a shell, use `docker compose exec db psql -U nexora nexora_production`.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora_production"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    restart: always
    build: .
    env_file: .env.docker
    environment:
      PGHOST: db
      PGUSER: nexora
      # AI calls wait on the model for up to a minute, so give Puma enough threads.
      RAILS_MAX_THREADS: "10"
      # Runs background jobs (reminders, cleanup) inside the web process.
      SOLID_QUEUE_IN_PUMA: "true"
      # Thruster rejects uploads above 20 MB before they reach Rails.
      MAX_REQUEST_BODY: "20971520"
    ports:
      - "5001:80"
    depends_on:
      db:
        condition: service_healthy

  # Public tunnel — opt in with `docker compose --profile tunnel up`.
  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    env_file: .env.docker
    command:
      - "http"
      - "app:80"
    ports:
      - "4040:4040"
    depends_on:
      app:
        condition: service_started

volumes:
  postgres_data:
