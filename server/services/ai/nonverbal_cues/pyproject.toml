[tool.poetry]
name = "nonverbal-cues"
version = "1.0.0"
description = "FastAPI WebSocket microservice for real-time nonverbal cue detection (gaze, blink, hand activity)"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python              = "^3.12"
fastapi             = "^0.135.1"
uvicorn             = {version = "^0.42.0", extras = ["standard"]}
mediapipe           = "^0.10.33"
opencv-python       = "^4.13.0"
numpy               = "^2.4.3"
scipy               = "^1.17.1"
websockets          = "^16.0"

[tool.poetry.group.dev.dependencies]
pytest              = "^8.0"
httpx               = "^0.28.1"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
